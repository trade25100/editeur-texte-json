<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Éditeur de valeurs Texte JSON</title><style>body{font-family:system-ui;background:#101827;color:#f1f5f9;max-width:1050px;margin:35px auto;padding:0 18px}textarea,input,button{font:inherit;border-radius:9px;padding:10px}textarea{width:100%;box-sizing:border-box;background:#1e293b;color:#fff;border:1px solid #64748b;height:280px}input{width:110px;background:#1e293b;color:#fff;border:1px solid #64748b}button{background:#38bdf8;border:0;cursor:pointer;margin:5px;color:#071522;font-weight:700}section{background:#172238;padding:18px;border-radius:14px;margin:15px 0}.item{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:9px 0}.muted{color:#a7b5c9}#status{color:#86efac}</style></head><body><h1>Éditeur JSON — valeurs « Texte »</h1><p class="muted">Colle ton JSON ou importe un fichier. Modifie les valeurs en 3 chiffres sans toucher aux autres actions.</p><section><input type="file" id="file" accept=".json,.txt,application/json"><button id="example">Charger l'exemple</button><p>JSON :</p><textarea id="source" placeholder='[{"kind":"Texte","value":"666"}]'></textarea><p><button id="load">Analyser les valeurs</button> <span id="status"></span></p></section><section><h2>Valeurs à modifier</h2><div id="fields">Charge un JSON pour commencer.</div><button id="apply">Appliquer les changements</button><button id="download">Télécharger JSON</button><button id="copy">Copier JSON</button></section><script>
const $=id=>document.getElementById(id);let parsed=null,targets=[];const example=[{"kind":"Clic gauche","value":"-1219,224"},{"kind":"Raccourci","value":"ctrl+a"},{"kind":"Texte","value":"666"},{"kind":"Clic gauche","value":"-1180,225"},{"kind":"Raccourci","value":"ctrl+a"},{"kind":"Texte","value":"616"},{"kind":"Clic gauche","value":"-1134,240"},{"kind":"Clic gauche","value":"-1021,650"},{"kind":"Clic gauche","value":"-1018,757"},{"kind":"Clic gauche","value":"-767,876"},{"kind":"Clic gauche","value":"-721,780"},{"kind":"Clic gauche","value":"-639,991"},{"kind":"Clic gauche","value":"-917,589"},{"kind":"Clic gauche","value":"-988,835"}];$('example').onclick=()=>{$('source').value=JSON.stringify(example,null,2);load()};$('file').onchange=async e=>{const f=e.target.files[0];if(f){$('source').value=await f.text();load()}};function load(){try{parsed=JSON.parse($('source').value);targets=[];function walk(node,path){if(Array.isArray(node)){node.forEach((v,i)=>walk(v,path.concat(i)))}else if(node&&typeof node==='object'){if(node.kind==='Texte'&&Object.prototype.hasOwnProperty.call(node,'value'))targets.push({node,path});Object.entries(node).forEach(([k,v])=>walk(v,path.concat(k)))}}walk(parsed,[]);$('fields').replaceChildren();targets.forEach((t,i)=>{let row=document.createElement('div');row.className='item';let label=document.createElement('label');label.textContent=`Texte ${i+1} (action ${t.path.join(' / ')||'racine'}) : `;let inp=document.createElement('input');inp.type='number';inp.min='100';inp.max='999';inp.step='1';inp.inputMode='numeric';inp.value=String(t.node.value);inp.dataset.index=i;row.append(label,inp);$('fields').append(row)});$('status').textContent=`${targets.length} valeur(s) « Texte » trouvée(s).`}catch(e){parsed=null;targets=[];$('status').textContent='JSON invalide : '+e.message}}$('load').onclick=load;function apply(){if(!parsed){alert('Analyse d’abord un JSON valide.');return false}for(const inp of $('fields').querySelectorAll('input'))if(!/^\d{3}$/.test(inp.value)){alert('Chaque valeur doit contenir exactement 3 chiffres.');inp.focus();return false}for(const inp of $('fields').querySelectorAll('input'))targets[+inp.dataset.index].node.value=inp.value;$('source').value=JSON.stringify(parsed,null,2);$('status').textContent='Modifications appliquées.';return true}$('apply').onclick=apply;$('download').onclick=()=>{if(!apply())return;const blob=new Blob([$('source').value],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='actions-modifiees.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('copy').onclick=async()=>{if(!apply())return;try{await navigator.clipboard.writeText($('source').value);$('status').textContent='JSON copié.'}catch{alert('Copie impossible : sélectionne le texte et copie-le.')}};</script></body></html>
